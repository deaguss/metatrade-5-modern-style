<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaTrader 5 Modern Style - prototype</title>
<!--
  PROTOTYPE of MetaTrader 5 Modern Style: the ActionInna order ticket and the modern chart style,
  in a browser, with made-up prices. Nothing connects to MetaTrader 5 and no order is sent.

  - ?variant=A|B|C       three order tickets: A Floating ticket (the one that was built),
                         B Sidebar dock, C On-chart position. Switch with the bar at the bottom or
                         the left and right arrow keys.
  - ?shell=modern|mt5    the window: the clean layout, or MetaTrader 5 as it opens.
  - ?clean=1             hides the prototype bar (for screenshots).

  Open it with a double-click, or run: node prototype/serve.js  and open http://127.0.0.1:8140/
-->
<style>
:root{--bg:#0f0f0f;--pn:#1a1a1a;--pn2:#141414;--ln:#2a2a2a;--ln2:#3a3a3a;--tx:#dbdbdb;--mu:#8c8c8c;--blue:#2962ff;--red:#f23645;--green:#089981;--neg:#ff6e6e;--pos:#48c87d;--warn:#f2b150}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{font:13px/1.35 "Trebuchet MS",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{display:block}
.fill{flex:1}
.k{color:var(--mu)}.neg{color:var(--neg)}.pos{color:var(--pos)}
b,.px,input{font-variant-numeric:tabular-nums}

/* ---------- shell: the clean layout ---------- */
.shell{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.menubar{display:flex;align-items:center;height:24px;padding:0 6px;font-size:12px;color:#a0a0a0;border-bottom:1px solid #222;flex:none}
.menubar span{padding:2px 8px;border-radius:4px;cursor:default}
.menubar span:hover{background:#2a2a2a;color:#eee}
.toolbar{display:flex;align-items:center;gap:2px;height:42px;padding:0 8px;border-bottom:1px solid #222;flex:none;overflow:hidden}
.tsep{width:1px;height:22px;background:#2e2e2e;margin:0 6px;flex:none}
.tbtn,.tf,.sympill{height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:4px;color:#d1d1d1;white-space:nowrap;flex:none}
.tbtn:hover,.tf:hover,.sympill:hover{background:#2a2a2a}
.tf{padding:0 6px}
.tf.on{background:#2a2a2a;color:#fff;font-weight:700}
.sympill{background:#1e1e1e;border-radius:16px;padding:0 12px;font-weight:700}
.algo.off{color:#ff6e6e}.algo.on{color:#48c87d}
.main{display:flex;flex:1;min-height:0;position:relative}
.center{display:flex;flex-direction:column;flex:1;min-width:0}
.chartwrap{position:relative;flex:1;min-height:0;overflow:hidden}
.chartwrap canvas{position:absolute;left:0;top:0;touch-action:none}
.ovl{position:absolute;inset:0;pointer-events:none;z-index:6}
.legend{position:absolute;top:6px;left:10px;z-index:5;pointer-events:none;white-space:nowrap;font-size:13px;color:#d1d4dc}
.legend .sy{font-weight:700;font-size:14px}
.legend .o{color:#8c8c8c;margin-left:8px}
.legend.l5{font:11px Tahoma,Verdana,Arial,sans-serif;top:3px;left:4px;color:#e0e0e0}
.corner{position:absolute;right:0;bottom:0;display:flex;z-index:7}
.corner button{width:32px;height:28px;display:grid;place-items:center;color:#8c8c8c;font-weight:700;font-size:12px}
.corner button:hover{color:#fff;background:#1e1e1e}
.corner button.on{color:var(--blue)}
.rightcol{width:288px;flex:none;border-left:4px solid #000;display:flex;flex-direction:column;background:var(--bg)}
.rc-closed .rightcol{display:none}
.rc-open{display:none;position:absolute;right:0;top:45%;width:16px;height:48px;background:#1e1e1e;border-radius:4px 0 0 4px;color:#aaa;z-index:9;place-items:center}
.rc-closed .rc-open{display:grid}
.rc-h{height:44px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;font-weight:700;font-size:14px;flex:none}
.rc-h .k{font-weight:400;font-size:12px}
.mw-cols,.mw-row{display:grid;grid-template-columns:1fr 92px 66px;align-items:center;padding:0 12px}
.mw-cols{height:28px;color:var(--mu);font-size:12px;border-bottom:1px solid #222;flex:none}
.mw-cols span:nth-child(n+2),.mw-row span:nth-child(n+2){text-align:right}
.mw-row{height:30px;margin:0 2px;border:1px solid transparent;border-radius:4px;cursor:default;font-size:13.5px}
.mw-row:hover{background:#1a1a1a}
.mw-row.sel{border-color:#5d5d5d}
.mw-sym{display:flex;align-items:center;gap:8px;font-weight:700}
.mw-sym i{width:18px;height:18px;border-radius:50%;display:inline-block;flex:none}
.up{color:#22ab94}.dn{color:#f7525f}
.mw-det{margin-top:auto;border-top:4px solid #000;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.d-sym{display:flex;align-items:center;gap:8px}
.d-sym i{width:22px;height:22px;border-radius:50%;background:#f0b90b}
.d-px b{font-size:24px}
.d-bar{height:4px;background:#2a2a2a;border-radius:2px;position:relative;margin-top:4px}
.d-bar i{position:absolute;top:-3px;width:2px;height:10px;background:#dbdbdb}
.d-rl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.charttabs{height:22px;display:flex;border-top:1px solid #222;font-size:12px;flex:none;background:var(--bg)}
.charttabs span{padding:2px 12px;border-right:1px solid #222;color:#999}
.charttabs .on{background:#1e1e1e;color:#fff}
.statusbar{height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:12px;color:#8c8c8c;border-top:1px solid #222;flex:none}
.conn{color:#48c87d}

/* ---------- shell: MetaTrader 5 as it opens (dark theme) ---------- */
.mt5{background:#1b1b1b}
.mt5 .menubar{background:#1f1f1f;color:#e6e6e6;height:22px;border-bottom:1px solid #2d2d2d}
.mt5 .toolbar{height:30px;background:#1f1f1f;border-bottom:1px solid #2d2d2d;padding:0 4px;gap:1px}
.mt5 .tbtn,.mt5 .tf{height:24px;padding:0 5px;font:12px Tahoma,Verdana,Arial,sans-serif;border-radius:2px;color:#e6e6e6}
.mt5 .tf.on{background:#3a3a3a;outline:1px solid #5a5a5a;font-weight:400}
.mt5 .tsep{height:18px;background:#3a3a3a;margin:0 3px}
.ti{width:24px;height:24px;display:grid;place-items:center;color:#5aa0f0;flex:none}
.leftcol{width:222px;flex:none;background:#1b1b1b;border-right:3px solid #2b2b2b;display:flex;flex-direction:column;font:12px Tahoma,Verdana,Arial,sans-serif;color:#e6e6e6}
.pane-h{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 5px;background:#1f1f1f}
.mw5{width:100%;border-collapse:collapse;table-layout:fixed}
.mw5 th{font-weight:400;text-align:left;padding:2px 4px;border-bottom:1px solid #333;border-right:1px solid #333}
.mw5 th:first-child{width:82px}
.mw5 td{padding:1px 4px;height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw5 td.b,.mw5 td.a,.mw5 td.c{text-align:right}
.mw5 tr.sel td{background:#0b5ca8;color:#fff}
.mw5-add{padding:2px 6px;color:#8c8c8c}
.pane-tabs,.tb-tabs{margin-top:auto;display:flex;border-top:1px solid #333;flex:none}
.pane-tabs span,.tb-tabs span{padding:3px 10px;color:#ccc;white-space:nowrap}
.pane-tabs .on,.tb-tabs .on{background:#2a2a2a;color:#fff}
.mt5 .charttabs{background:#1b1b1b;border-top:1px solid #2d2d2d;font-family:Tahoma,Verdana,Arial,sans-serif}
.mt5 .charttabs span{color:#ccc;border-color:#2d2d2d}
.mt5 .charttabs .on{background:#2e2e2e;color:#fff}
.toolbox{height:184px;flex:none;background:#1b1b1b;border-top:3px solid #2b2b2b;display:flex;flex-direction:column;font:12px Tahoma,Verdana,Arial,sans-serif;color:#e6e6e6;overflow:hidden}
.tb-head,.tb-row{display:grid;grid-template-columns:1fr 220px 160px 100px;padding:0 6px;flex:none}
.tb-head{height:20px;align-items:center;border-bottom:1px solid #333}
.tb-row{height:19px;align-items:center;font-weight:700}
.tb-row.sel{background:#0b5ca8}
.mt5 .statusbar{height:22px;background:#1f1f1f;border-top:1px solid #2d2d2d;color:#bbb;font:12px Tahoma,Verdana,Arial,sans-serif}

/* ---------- floating drawing toolbar ---------- */
.drawbar{position:absolute;z-index:15;display:flex;align-items:center;gap:1px;padding:3px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.drawbar .grip{width:16px;text-align:center;font-size:13px}
.drawbar button{position:relative;width:34px;height:32px;border-radius:4px;display:grid;place-items:center;color:#c8c8c8}
.drawbar button:hover{background:#2a2a2a}
.drawbar button.on{color:#5b8cff;background:#1b2438}
.drawbar .dot{position:absolute;right:4px;bottom:4px;width:4px;height:4px;border-radius:50%}
.dot.native{background:#48c87d}.dot.custom{background:#f2b150}
.db-sep{width:1px;height:20px;background:#2e2e2e;margin:0 3px}

/* object toolbar, shown while a drawing is selected */
.otb{position:absolute;z-index:16;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;gap:4px;width:max-content;max-width:min(600px,90%);padding:4px 6px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:12px}
.otb-name{font-weight:700;padding:0 4px}
.otb-sep{width:1px;height:18px;background:#2e2e2e;margin:0 2px}
.sw{width:18px;height:18px;border-radius:3px;background:var(--c);border:2px solid #1a1a1a;outline:1px solid #444}
.sw.on{outline:2px solid #fff}
.wb{width:24px;height:24px;border-radius:3px;display:grid;place-items:center}
.wb i{display:block;width:14px;background:#dbdbdb}
.wb i.dash{height:2px;background:repeating-linear-gradient(90deg,#dbdbdb 0 4px,transparent 4px 7px)}
.wb.on{background:#2e2e2e}
.otb-mt5{margin-left:6px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.otb-mt5.native{background:rgba(72,200,125,.15);color:#48c87d}
.otb-mt5.custom{background:rgba(242,177,80,.15);color:#f2b150}
.otb-how{flex-basis:100%;color:var(--mu);font-size:11px;padding:0 4px 2px}

/* chart settings */
.csettings{position:absolute;right:8px;bottom:34px;z-index:30;width:312px;padding:10px 12px 12px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:12px}
.cs-h{display:flex;align-items:center;justify-content:space-between}
.cs-l{margin-top:8px;color:#d0d0d0}
.cs-l small{display:block;color:var(--mu);font-size:11px}
.cs-o{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.opt{height:26px;padding:0 8px;border:1px solid var(--ln2);border-radius:4px;display:flex;align-items:center;gap:6px}
.opt:hover{border-color:#5a5a5a}
.opt.on{border-color:#dbdbdb;background:#2a2a2a;color:#fff}
.cc{width:12px;height:12px;background:linear-gradient(90deg,var(--a) 50%,var(--b) 50%);outline:1px solid var(--bd,#555)}
.sq{width:12px;height:12px;border:1px solid #555}
.cs-f{color:var(--mu);font-size:11px;margin:10px 0 0}

/* ---------- panel atoms (shared tokens) ---------- */
.ibtn{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#a8a8a8;flex:none}
.ibtn:hover{background:#2e2e2e;color:#fff}
.ibtn.on{color:#5b8cff}
.grip{color:#5f5f5f;cursor:grab;user-select:none}
.tk-sym{font-weight:700;font-size:14px}
.tk-sub{color:var(--mu);font-size:12px}
.side{border-radius:6px;border:1px solid;display:flex;flex-direction:column;justify-content:center;padding:0 12px;text-align:left;min-width:0}
.side .lbl{font-size:11px;font-weight:700;letter-spacing:.06em}
.side .px{font-size:20px;font-weight:700;line-height:1.15}
.side.sell{color:#ff7d88;border-color:rgba(242,54,69,.5);background:rgba(242,54,69,.10)}
.side.buy{color:#7fb0ff;border-color:rgba(41,98,255,.55);background:rgba(41,98,255,.12);align-items:flex-end;text-align:right}
.side.sell.on{background:var(--red);border-color:var(--red);color:#fff}
.side.buy.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;background:#111;border:1px solid var(--ln);border-radius:6px}
.seg button{height:26px;border-radius:4px;color:#a8a8a8;font-size:12px}
.seg button.on{background:#2e2e2e;color:#fff;font-weight:700}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr 1.7fr;gap:4px}
.chip{height:30px;border:1px solid var(--ln2);border-radius:4px;color:#cfcfcf;font-size:12px}
.chip:hover{border-color:#5a5a5a}
.chip.on,.chipf.on{border-color:#dbdbdb;background:#262626;color:#fff;font-weight:700}
.fld{display:flex;align-items:center;height:30px;border:1px solid var(--ln2);border-radius:4px;background:#111;min-width:0}
.fld:focus-within{border-color:var(--blue)}
.fld.bad{border-color:var(--red)}
.fld input{flex:1;min-width:0;width:100%;height:100%;background:none;border:0;outline:0;text-align:center;font-weight:700}
.st{width:24px;height:100%;color:#8c8c8c;font-size:15px;flex:none}
.st:hover{color:#fff;background:#222}
.chipf input{text-align:right;padding-right:4px}
.cu{height:100%;padding:0 6px;color:#a8a8a8;font-size:12px;border-left:1px solid var(--ln2);flex:none}
.fline{display:grid;grid-template-columns:1fr 58px;gap:4px}
.unit{height:30px;border:1px solid var(--ln2);border-radius:4px;color:#cfcfcf;font-size:12px}
.unit:hover{border-color:#5a5a5a}
.confirm{display:flex;gap:6px}
.cbtn{flex:1;height:42px;border-radius:6px;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
.cbtn.sell{background:var(--red)}
.cbtn:disabled{background:#262626;color:#6f6f6f;cursor:default}
.xbtn{width:44px;height:42px;border-radius:6px;border:1px solid var(--ln2);color:#cfcfcf;flex:none}
.status,.qstatus{font-size:12px}
.status:empty,.qstatus:empty{display:none}
.l1{color:var(--warn)}.l2{color:var(--neg)}.l3{color:var(--pos)}

/* ---------- variant A: floating ticket ---------- */
.tk{position:absolute;z-index:20;width:304px;background:var(--pn);border:1px solid #333;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.6);user-select:none}
.tk-h{height:40px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-bottom:1px solid var(--ln);cursor:grab}
.tk-h:active{cursor:grabbing}
.tk-b{padding:10px;display:flex;flex-direction:column;gap:8px}
.sides{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sides .side{height:56px}
.spread{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pn);border:1px solid #333;border-radius:10px;padding:0 7px;font-size:11px;color:#a8a8a8;line-height:18px}
.row{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:8px}
.row>label{color:var(--mu);font-size:12px}
.sum{border-top:1px solid var(--ln);padding-top:8px}
.lotsline{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.tiles div{background:#141414;border-radius:4px;padding:5px 7px;display:flex;flex-direction:column;font-size:12px;line-height:1.3;min-width:0}
.tiles .k{font-size:11px}
.meta{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:11.5px;color:var(--mu)}
.meta b{color:var(--tx)}
.tk-mini{display:none}
.tk.collapsed .tk-b{display:none}
.tk.collapsed .tk-mini{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:8px;align-items:center}
.side.sm{height:40px}.side.sm .px{font-size:15px}
.mini-mid{display:flex;flex-direction:column;align-items:center;font-size:12px}

/* ---------- variant B: sidebar dock ---------- */
.sb{position:absolute;z-index:20;background:var(--pn2);border-left:1px solid var(--ln);display:flex;user-select:none}
.sb.left{border-left:0;border-right:1px solid var(--ln)}
.sb-full{display:flex;flex-direction:column;width:100%;min-height:0}
.sb.collapsed .sb-full{display:none}
.sb-rail{display:none}
.sb.collapsed .sb-rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;width:100%}
.sb-h{display:flex;align-items:center;gap:4px;padding:10px 8px 8px 12px;flex:none}
.sb.left .sb-h .chev svg,.sb:not(.left) .sb-rail .chev svg{transform:rotate(180deg)}
.sb-acct{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 10px;font-size:12px;flex:none}
.sb-acct div{display:flex;flex-direction:column}
.sb-quote{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;flex:none}
.side.tall{height:64px}.side.tall .px{font-size:21px}
.sb-spread{text-align:center;color:var(--mu);font-size:12px;padding:5px 0 8px;flex:none}
.sb-scroll{flex:1;min-height:0;overflow:auto;padding:0 12px 10px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field>label{font-size:12px;color:#bdbdbd}
.dt{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0;font-size:12.5px}
.dt dt{color:var(--mu)}.dt dd{margin:0;text-align:right;font-weight:700}
.sb-foot{padding:10px 12px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:6px;flex:none}
.rs{width:30px;height:30px;border-radius:4px;font-weight:700;border:1px solid}
.rs.sell{color:#ff7d88;border-color:rgba(242,54,69,.5)}.rs.buy{color:#7fb0ff;border-color:rgba(41,98,255,.55)}
.rs.sell.on{background:var(--red);color:#fff}.rs.buy.on{background:var(--blue);color:#fff}
.rail-txt{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--mu);font-size:11px;letter-spacing:.15em;margin-top:8px}

/* ---------- variant C: on-chart position ---------- */
.qwrap{position:absolute;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:flex-start;user-select:none}
.qb{display:flex;align-items:stretch;background:var(--pn);border:1px solid #333;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.5);overflow:hidden;height:46px}
.qb .grip{display:grid;place-items:center;width:18px}
.qside{display:flex;flex-direction:column;justify-content:center;padding:0 12px;min-width:98px}
.qside .lbl{font-size:10px;font-weight:700;letter-spacing:.06em}
.qside .px{font-size:16px;font-weight:700}
.qside.sell{color:#ff7d88;background:rgba(242,54,69,.12)}
.qside.buy{color:#7fb0ff;background:rgba(41,98,255,.14);text-align:right;align-items:flex-end}
.qside.sell.on{background:var(--red);color:#fff}.qside.buy.on{background:var(--blue);color:#fff}
.qmid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;min-width:88px;font-size:12px;border-left:1px solid #333;border-right:1px solid #333;position:relative}
.qmid:hover,.qmid.on{background:#232323}
.caret{position:absolute;right:4px;top:2px;font-size:9px;color:var(--mu)}
.qmenu{width:324px;padding:10px;background:var(--pn);border:1px solid #333;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
.qhint{font-size:11.5px;color:var(--mu)}
.qstatus{max-width:340px;background:rgba(20,20,20,.92);border:1px solid #333;border-radius:4px;padding:4px 8px}
.cbox-ui{position:absolute;inset:0;pointer-events:none}
.zl,.pill{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:auto;font-size:12px}
.zl{padding:2px 4px 2px 8px;border-radius:4px;color:#fff}
.zl.tp{background:rgba(8,153,129,.92)}.zl.sl{background:rgba(242,54,69,.92)}
.zl b{color:#fff}

<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad2=n=>String(n).padStart(2,'0');
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry(20261125);
const gauss=()=>{let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const money=(v,plus)=>(v<0?'-':(plus&&v>0?'+':''))+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=v=>'$'+Math.round(v).toLocaleString('en-US');
const px2=p=>p.toFixed(2);
const tr=(v,d=2)=>String(+(+v).toFixed(d));
const hexA=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
const fgOn=c=>['#ffffff','#c0c0c0','#c8c8c8','#ff9800','#00bcd4'].includes(c.toLowerCase())?'#000':'#fff';
const FONT_MODERN='12px "Trebuchet MS", Arial, sans-serif';
const FONT_MT5='11px Tahoma, Verdana, Arial, sans-serif';

/* ================= icons ================= */
const ICON={

  tpl:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',

  camera:'<path d="M4 8h4l2-3h4l2 3h4v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  dock:'<rect x="4" y="5" width="16" height="14" rx="1"/><path d="M14 5v14"/>',minus:'<path d="M6 12h12"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',

/* ================= market (fake) ================= */
const TF=15*60*1000;
const M={symbol:'XAUUSD',pip:0.1,contract:100,lev:100,bid:3539.31,ask:3539.50,equity:100000};
const bars=[];
(function(){
  const N=700,end=Math.floor(Date.now()/TF)*TF;let p=3400,drift=0;
  for(let i=0;i<N;i++){drift=drift*0.93+gauss()*0.22-(p-3400)*0.0015;const o=p,c=o+drift+gauss()*1.7;bars.push({t:end-(N-1-i)*TF,o,h:Math.max(o,c)+Math.abs(gauss())*1.2,l:Math.min(o,c)-Math.abs(gauss())*1.2,c});p=c;}
  const sh=M.bid-bars[N-1].c;for(const b of bars){b.o+=sh;b.h+=sh;b.l+=sh;b.c+=sh;}
  const L=bars[N-1];L.c=M.bid;L.h=Math.max(L.h,M.bid);L.l=Math.min(L.l,M.bid);
})();
const timeOf=i=>bars[0].t+Math.round(i)*TF;
const WL=[
  {s:'XAUUSD',d:2,p:3539.31,chg:-0.35,c:'#f0b90b',live:true},{s:'BTCUSD',d:0,p:59317,chg:-0.71,c:'#f7931a'},
  {s:'NZDUSD',d:5,p:0.54726,chg:-0.16,c:'#3d7bd9'},{s:'EURUSD',d:5,p:1.09556,chg:-0.08,c:'#3d7bd9'},
  {s:'USDJPY',d:3,p:159.300,chg:0.03,c:'#3d7bd9'},{s:'GBPJPY',d:3,p:208.770,chg:-0.03,c:'#3d7bd9'},
  {s:'AUDUSD',d:5,p:0.66402,chg:0.01,c:'#3d7bd9'},{s:'NAS100',d:2,p:26144.53,chg:-0.32,c:'#26a69a'},
];
for(const w of WL){w.open=w.p/(1+w.chg/100);w.dir=0;}

/* ================= trade state ================= */
const S={
  side:1,orderType:'market',entry:3530,
  chip:0,custom:1.01,customUnit:'%',
  slUnit:'pips',slPips:150,slPx:0,
  tpUnit:'R',tpR:1,tpPips:150,tpPx:0,
  errs:{},editing:null,forceField:null,
  algo:false,flash:null,positions:[],nextTicket:51234567,
  a:{x:0,y:12,docked:true,collapsed:false},
  b:{side:'right',collapsed:false},
  c:{x:10,y:34,menu:false,i0:null,len:28},
  bar:{x:120,y:124},
  rcOpen:true,settingsOpen:false,
  theme:{candles:'modern',bg:'#0f0f0f',grid:false,priceLine:true,legend:true,axis:'modern'},
  draw:{tool:null,items:[],sel:null,pending:null,magnet:false,nextId:1},
};
const ALGO_MSG='Turn on Algo Trading (toolbar button) to send orders';
function riskInfo(){return S.chip<3?{mode:'%',v:[1,1.5,2][S.chip]}:{mode:S.customUnit,v:S.custom};}
function entryOf(side){return S.orderType==='market'?(side>0?M.ask:M.bid):S.entry;}
function calc(){
  const side=S.side||1,entry=entryOf(side),pv=M.contract*M.pip;
  const slP=S.slUnit==='price'?(entry-S.slPx)*side/M.pip:S.slPips;
  const tpP=S.tpUnit==='price'?(S.tpPx-entry)*side/M.pip:S.tpUnit==='R'?slP*S.tpR:S.tpPips;
  const ri=riskInfo();let lots;
  if(ri.mode==='lot')lots=Math.floor(ri.v*100+1e-7)/100;
  else{const m=ri.mode==='%'?M.equity*ri.v/100:ri.v;lots=slP>0?Math.floor(m/(slP*pv)*100+1e-7)/100:0;}
  const risk=lots*Math.max(slP,0)*pv,reward=lots*Math.max(tpP,0)*pv,margin=lots*M.contract*entry/M.lev;
  const used=S.positions.reduce((a,p)=>a+p.lots*M.contract*p.entry/M.lev,0);
  let kind=side>0?'BUY':'SELL';
  if(S.orderType==='pending'){const ref=side>0?M.ask:M.bid;kind+=((side>0)===(entry<ref))?' LIMIT':' STOP';}
  return {side,entry,sl:entry-side*slP*M.pip,tp:entry+side*tpP*M.pip,slP,tpP,lots,risk,reward,rr:slP>0?tpP/slP:0,pipVal:lots*pv,margin,free:M.equity-used-margin,kind,ri};
}
const riskShort=ri=>ri.mode==='%'?tr(ri.v,2)+'%':ri.mode==='lot'?tr(ri.v,2)+' lot':money0(ri.v);
function statusOf(c){
  if(S.flash&&S.flash.until>Date.now())return S.flash;
  const e=Object.values(S.errs)[0];if(e)return {text:e,level:2};
  if(S.side){
    if(c.slP<=0)return {text:'Stop loss is on the wrong side of the entry',level:2};
    if(c.tpP<=0)return {text:'Take profit is on the wrong side of the entry',level:2};
    if(c.lots<0.01)return {text:'Risk too small: under 0.01 lots with this stop loss',level:2};
  }
  if(!S.algo)return {text:ALGO_MSG,level:2};
  return {text:'',level:0};
}
const canConfirm=c=>!!S.side&&!Object.keys(S.errs).length&&c.slP>0&&c.tpP>0&&c.lots>=0.01;
function view(){
  const c=calc(),pct=v=>'('+(v/M.equity*100).toFixed(2)+'%)';
  return {c,st:statusOf(c),ok:canConfirm(c),
    bid:px2(M.bid),ask:px2(M.ask),spread:tr((M.ask-M.bid)/M.pip,1),
    lots:c.lots.toFixed(2),units:'('+Math.round(c.lots*M.contract)+' units)',
    risk:money(-c.risk),riskPct:pct(c.risk),reward:money(c.reward,true),rewardPct:pct(c.reward),
    riskFull:money(-c.risk)+' '+pct(c.risk),rewardFull:money(c.reward,true)+' '+pct(c.reward),
    rr:'1:'+c.rr.toFixed(2),dist:'SL '+c.slP.toFixed(1)+' · TP '+c.tpP.toFixed(1),
    pipVal:money(c.pipVal),margin:money(c.margin),free:money0(c.free),freeFull:'(free '+money0(c.free)+')',equity:money(M.equity),
    kind:c.kind,confirm:S.side?`Confirm ${c.kind} ${c.lots.toFixed(2)} lots`:'Pick SELL or BUY',confirmShort:'Confirm',
    riskShort:riskShort(c.ri),slUnit:S.slUnit,tpUnit:S.tpUnit,customUnit:S.customUnit};
}

/* typed fields: a tick never overwrites a field that is focused or holds a typo */
function fieldText(n){switch(n){
  case 'sl':return S.slUnit==='pips'?tr(S.slPips,1):px2(S.slPx);
  case 'tp':return S.tpUnit==='R'?tr(S.tpR,2):S.tpUnit==='pips'?tr(S.tpPips,1):px2(S.tpPx);
  case 'custom':return tr(S.custom,2);
  case 'entry':return px2(S.entry);}return '';}
const BAD={sl:'Stop loss: type a number',tp:'Take profit: type a number',custom:'Risk: type a number',entry:'Entry: type a price'};
function applyField(n,raw){
  const t=raw.trim().replace(',','.'),v=Number(t);
  if(t===''||!isFinite(v)||v<=0){S.errs[n]=BAD[n];return;}
  delete S.errs[n];
  if(n==='sl'){if(S.slUnit==='pips')S.slPips=v;else S.slPx=v;}
  else if(n==='tp'){if(S.tpUnit==='R')S.tpR=v;else if(S.tpUnit==='pips')S.tpPips=v;else S.tpPx=v;}
  else if(n==='custom'){S.custom=v;S.chip=3;}
  else if(n==='entry')S.entry=v;
}
function cycleUnit(n){
  const c=calc();
  if(n==='sl'){if(S.slUnit==='pips'){S.slUnit='price';S.slPx=+c.sl.toFixed(2);}else{S.slUnit='pips';S.slPips=Math.max(0.1,+c.slP.toFixed(1));}}
  else if(n==='tp'){const o=['R','pips','price'],nx=o[(o.indexOf(S.tpUnit)+1)%3];
    if(nx==='R')S.tpR=+(c.slP>0?c.tpP/c.slP:1).toFixed(2);if(nx==='pips')S.tpPips=+c.tpP.toFixed(1);if(nx==='price')S.tpPx=+c.tp.toFixed(2);S.tpUnit=nx;}
  else if(n==='custom'){const o=['%','lot','$'],nx=o[(o.indexOf(S.customUnit)+1)%3];S.customUnit=nx;
    S.custom=nx==='%'?1:nx==='lot'?(+c.lots.toFixed(2)||0.01):(Math.round(c.risk)||500);S.chip=3;}
  delete S.errs[n];S.forceField=n;
}
function step(n,dir,fine){
  if(n==='sl'){if(S.slUnit==='pips')S.slPips=Math.max(1,+(S.slPips+dir*(fine?1:10)).toFixed(1));else S.slPx=+(S.slPx+dir*(fine?0.1:1)).toFixed(2);}
  if(n==='tp'){if(S.tpUnit==='R')S.tpR=Math.max(0.1,+(S.tpR+dir*(fine?0.1:0.5)).toFixed(2));else if(S.tpUnit==='pips')S.tpPips=Math.max(1,+(S.tpPips+dir*(fine?1:10)).toFixed(1));else S.tpPx=+(S.tpPx+dir*(fine?0.1:1)).toFixed(2);}
  if(n==='custom'){const st=S.customUnit==='%'?(fine?0.01:0.25):S.customUnit==='lot'?(fine?0.01:0.1):(fine?10:100);S.custom=Math.max(st,+(S.custom+dir*st).toFixed(2));S.chip=3;}
  if(n==='entry')S.entry=+(S.entry+dir*(fine?0.1:1)).toFixed(2);
  delete S.errs[n];S.forceField=n;
}
function setSide(v){S.side=v;S.flash=null;if(variant==='C'&&S.c.i0==null)S.c.i0=bars.length-1;}
function setType(t){if(t==='pending'&&S.orderType!=='pending'){const sd=S.side||1;S.entry=+(entryOf(sd)-sd*50*M.pip).toFixed(2);}S.orderType=t;}
function cancel(){S.side=0;S.orderType='market';S.c.i0=null;S.c.shown=false;S.flash=null;}
function flash(text,level){S.flash={text,level,until:Date.now()+(level===3?6000:4000)};}
function confirmOrder(){
  const c=calc();if(!canConfirm(c))return;
  if(!S.algo){flash(ALGO_MSG,2);return;}
  S.positions.push({ticket:S.nextTicket++,side:c.side,lots:c.lots,entry:c.entry,sl:c.sl,tp:c.tp,kind:c.kind});
  flash(`${c.kind} ${c.lots.toFixed(2)} ${M.symbol} @ ${px2(c.entry)}: prototype, nothing was sent`,3);
  S.side=0;S.orderType='market';S.c.i0=null;S.c.shown=false;
}

/* ================= drawing tools ================= */
const TOOLS={
  short:{name:'Short Position',n:1,mt5:'custom',how:'Not built into MetaTrader 5.'},
  path:{name:'Path',n:-1,color:'#2962ff',w:2,mt5:'custom',how:'Not built into MetaTrader 5: draw it as several Trendlines.'},
  trend:{name:'Trend Line',n:2,color:'#2962ff',w:2,mt5:'native',how:'Trendline, built into MetaTrader 5.'},
  hline:{name:'Horizontal Line',n:1,color:'#2962ff',w:1,mt5:'native',how:'Horizontal Line, built into MetaTrader 5.'},
  triangle:{name:'Triangle',n:3,color:'#f57c00',w:1,mt5:'native',how:'Triangle (with Fill), built into MetaTrader 5.'},
  rotrect:{name:'Rotated Rectangle',n:3,color:'#9c27b0',w:1,mt5:'custom',how:'Not built into MetaTrader 5; the Equidistant Channel comes closest.'},
  rect:{name:'Rectangle',n:2,color:'#9c27b0',w:1,mt5:'native',how:'Rectangle (with Fill), built into MetaTrader 5.'},
  hray:{name:'Horizontal Ray',n:1,color:'#2962ff',w:1,mt5:'native',how:'A level Trendline with Ray right, built into MetaTrader 5.'},
  long:{name:'Long Position',n:1,mt5:'custom',how:'Not built into MetaTrader 5.'},
  fib:{name:'Fib Retracement',n:2,color:'#787b86',w:1,mt5:'native',how:'Fibonacci Retracement, built into MetaTrader 5; set the levels and colours in its properties.'},
  prange:{name:'Price Range',n:2,color:'#2962ff',w:1,mt5:'custom',how:'Not built into MetaTrader 5: the crosshair measures a range (click the mouse wheel and drag).'},
  arrow:{name:'Arrow',n:2,color:'#2962ff',w:2,mt5:'native',how:'Arrowed Line, built into MetaTrader 5.'},
};
const ORDER=['short','path','trend','hline','triangle','rotrect','rect','hray','long','fib','prange','arrow'];
const FIB=[[0,'#787b86'],[0.236,'#f23645'],[0.382,'#ff9800'],[0.5,'#4caf50'],[0.618,'#089981'],[0.786,'#00bcd4'],[1,'#787b86'],[1.618,'#2962ff']];
const DCOL=['#2962ff','#f23645','#089981','#ff9800','#9c27b0','#ffffff'];
const selItem=()=>S.draw.items.find(q=>q.id===S.draw.sel);
function seedDrawings(){
  const n=bars.length,D=S.draw,add=o=>{const T=TOOLS[o.type];D.items.push({id:D.nextId++,color:T.color||'#2962ff',w:T.w||1,dash:false,...o});};
  let hi=n-70,lo=n-70;for(let i=n-70;i<n-5;i++){if(bars[i].h>bars[hi].h)hi=i;if(bars[i].l<bars[lo].l)lo=i;}
  const a=Math.min(hi,lo),b=Math.max(hi,lo),pAt=i=>+(i===lo?bars[lo].l:bars[hi].h).toFixed(2);
  add({type:'fib',pts:[{i:a,p:pAt(a)},{i:b,p:pAt(b)}]});
  let s=Infinity;for(let i=n-40;i<n;i++)s=Math.min(s,bars[i].l);
  add({type:'hline',pts:[{i:n-20,p:+s.toFixed(2)}]});
  let h2=n-100;for(let i=n-100;i<n-30;i++)if(bars[i].h>bars[h2].h)h2=i;

  const out=[],tv=S.theme.axis==='modern',ax=CH.W-CH.axisW,a=Math.floor(iOf(0)),b=Math.ceil(iOf(ax));

/* drawings: render */
function rotCorners(s){if(s.length<3)return [s[0],s[1]];const dx=s[1].x-s[0].x,dy=s[1].y-s[0].y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,w=(s[2].x-s[0].x)*nx+(s[2].y-s[0].y)*ny;return [s[0],s[1],{x:s[1].x+nx*w,y:s[1].y+ny*w},{x:s[0].x+nx*w,y:s[0].y+ny*w}];}

    case 'path':g.beginPath();s.forEach((q,k)=>k?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.stroke();break;
    case 'hline':{const y=Math.round(s[0].y)+.5;g.beginPath();g.moveTo(P.x,y);g.lineTo(P.x+P.w,y);g.stroke();CH.drawTags.push({y:s[0].y,text:px2(it.pts[0].p),bg:col});break;}
    case 'hray':{const y=Math.round(s[0].y)+.5;g.beginPath();g.moveTo(s[0].x,y);g.lineTo(P.x+P.w,y);g.stroke();CH.drawTags.push({y:s[0].y,text:px2(it.pts[0].p),bg:col});break;}

/* drawings: hit testing */
function distSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;const t=L?clamp(((px-a.x)*dx+(py-a.y)*dy)/L,0,1):0;return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));}

    case 'hline':return Math.abs(y-s[0].y)<=tol;
    case 'hray':return Math.abs(y-s[0].y)<=tol&&x>=s[0].x-tol;
    case 'rect':case 'prange':case 'fib':{const x1=Math.min(s[0].x,s[1].x),x2=Math.max(s[0].x,s[1].x);let y1=Math.min(s[0].y,s[1].y),y2=Math.max(s[0].y,s[1].y);
      if(it.type==='fib'){const ys=FIB.map(([lv])=>yOf(fibPrice(it,lv)));y1=Math.min(...ys);y2=Math.max(...ys);}
      return x>=x1-tol&&x<=x2+tol&&y>=y1-tol&&y<=y2+tol;}
    case 'triangle':return inPoly(x,y,s.slice(0,3))||[0,1,2].some(k=>distSeg(x,y,s[k],s[(k+1)%3])<=tol);
    case 'rotrect':{const c=rotCorners(s);return inPoly(x,y,c)||c.some((q,k)=>distSeg(x,y,q,c[(k+1)%c.length])<=tol);}
    case 'long':case 'short':{const e=it.pts[0],x1=xOf(e.i),x2=xOf(e.i+it.len),ys=[yOf(e.p),yOf(it.tp),yOf(it.sl)];return x>=x1-tol&&x<=x2+tol&&y>=Math.min(...ys)-tol&&y<=Math.max(...ys)+tol;}
  }
  return false;
}
/* drawings: create and edit */
function ptAt(x,y){
  let i=Math.round(iOf(x)),p=pOf(y);
  if(S.draw.magnet){const b=bars[clamp(i,0,bars.length-1)];let best=null,bd=14;for(const v of [b.o,b.h,b.l,b.c]){const d=Math.abs(yOf(v)-y);if(d<bd){bd=d;best=v;}}if(best!=null)p=best;}
  return {i,p:+p.toFixed(2)};
}
function finishItem(base){const T=TOOLS[base.type],D=S.draw,it={id:D.nextId++,color:T.color||'#2962ff',w:T.w||1,dash:false,...base};D.items.push(it);D.sel=it.id;D.pending=null;D.tool=null;}
function startDraw(x,y){
  const D=S.draw,T=TOOLS[D.tool],pt=ptAt(x,y);
  if(D.pending){addPendingPoint(pt);return;}
  if(D.tool==='long'||D.tool==='short'){const off=(CH.pTop-CH.pBot)*0.07,sg=D.tool==='long'?1:-1;finishItem({type:D.tool,pts:[pt],tp:+(pt.p+sg*off).toFixed(2),sl:+(pt.p-sg*off).toFixed(2),len:Math.max(10,Math.round(130/CH.barW))});return;}
  if(T.n===1){finishItem({type:D.tool,pts:[pt]});return;}
  D.pending={type:D.tool,pts:[pt,{...pt}]};
  CH.drag={type:'create',x0:x,y0:y};
}
function addPendingPoint(pt){const pd=S.draw.pending,T=TOOLS[pd.type];pd.pts[pd.pts.length-1]=pt;if(T.n>0&&pd.pts.length>=T.n){finishItem({type:pd.type,pts:pd.pts.slice(0,T.n)});return;}pd.pts.push({...pt});}
function finishPath(){
  const pd=S.draw.pending;S.draw.pending=null;S.draw.tool=null;if(!pd)return;
  const pts=pd.pts.slice(0,-1).filter((q,k,a)=>!k||q.i!==a[k-1].i||q.p!==a[k-1].p);
  if(pd.type==='path'&&pts.length>=2)finishItem({type:'path',pts});
}
function dragHandle(it,k,x,y){
  const pt=ptAt(x,y);
  if(it.type==='long'||it.type==='short'){if(k===0)it.pts[0]=pt;if(k===1)it.tp=pt.p;if(k===2)it.sl=pt.p;if(k===3)it.len=Math.max(2,pt.i-it.pts[0].i);}
  else it.pts[k]=pt;
}
function deleteSel(){S.draw.items=S.draw.items.filter(q=>q.id!==S.draw.sel);S.draw.sel=null;}

/* trading lines: hit testing and dragging */
function hitLevel(x,y){
  if(!S.side||!inPlot(x,y))return null;const c=calc(),tol=5;
  if(variant==='C'){const b=CH.box;if(!b||x<b.x1-8||x>b.x2+8)return null;if(Math.abs(x-b.x2)<=7&&Math.abs(y-b.ye)<=8)return 'len';}
  let best=null,bd=tol+1;
  for(const [k,p] of [['tp',c.tp],['sl',c.sl],['entry',c.entry]]){if(k==='entry'&&variant!=='C'&&S.orderType==='market')continue;const d=Math.abs(y-yOf(p));if(d<bd){bd=d;best=k;}}
  return best;
}
function dragLevel(k,x,y){
  const c=calc(),p=+pOf(y).toFixed(2),side=c.side;
  if(k==='len'){S.c.len=Math.max(4,Math.round(iOf(x)-S.c.i0));return;}
  if(k==='entry'){S.orderType='pending';S.entry=p;return;}
  if(k==='sl'){const pips=Math.max(1,+((c.entry-p)*side/M.pip).toFixed(1));if(S.slUnit==='pips')S.slPips=pips;else S.slPx=+(c.entry-side*pips*M.pip).toFixed(2);delete S.errs.sl;S.forceField='sl';}
  if(k==='tp'){const pips=Math.max(1,+((p-c.entry)*side/M.pip).toFixed(1));if(S.tpUnit==='R')S.tpR=+(pips/c.slP).toFixed(2);else if(S.tpUnit==='pips')S.tpPips=pips;else S.tpPx=+(c.entry+side*pips*M.pip).toFixed(2);delete S.errs.tp;S.forceField='tp';}
}

function draw(){
  if(!ctx)return;
  const {W,H,dpr}=CH,P=CH.plot,g=ctx,th=TH(),tv=S.theme.axis==='modern',ax=W-CH.axisW;
  g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle=S.theme.bg;g.fillRect(0,0,W,H);
  const n=bars.length,i0=Math.max(0,Math.floor(iOf(P.x))),i1=Math.min(n-1,Math.ceil(iOf(P.x+P.w)));
  if(CH.auto){let lo=Infinity,hi=-Infinity;for(let i=i0;i<=i1;i++){lo=Math.min(lo,bars[i].l);hi=Math.max(hi,bars[i].h);}
    if(!isFinite(lo)){lo=M.bid-10;hi=M.bid+10;}
    // while a trade is being previewed, its SL and TP stay on screen
    if(S.side){const c=calc();lo=Math.min(lo,c.sl,c.tp,c.entry);hi=Math.max(hi,c.sl,c.tp,c.entry);}
    const pad=Math.max((hi-lo)*0.08,0.5);CH.pTop=hi+pad;CH.pBot=lo-pad;}
  const pstep=niceStep((CH.pTop-CH.pBot)/Math.max(1,P.h/46)),tlab=timeLabels();
  if(S.theme.grid){const m5=S.theme.candles==='mt5';g.strokeStyle=m5?'#3c3c3c':'rgba(255,255,255,.06)';g.lineWidth=1;g.setLineDash(m5?[1,3]:[]);g.beginPath();
    for(let p=Math.ceil(CH.pBot/pstep)*pstep;p<=CH.pTop;p+=pstep){const y=Math.round(yOf(p))+.5;g.moveTo(P.x,y);g.lineTo(P.x+P.w,y);}
    for(const t of tlab){if(t.x<P.x||t.x>P.x+P.w)continue;const x=Math.round(t.x)+.5;g.moveTo(x,0);g.lineTo(x,P.h);}g.stroke();g.setLineDash([]);}
  g.save();g.beginPath();g.rect(P.x,0,P.w,P.h);g.clip();
  const bw=CH.barW>=3?(Math.max(1,Math.round(CH.barW*0.7))|1):1;
  for(let i=i0;i<=i1;i++){const b=bars[i],x=Math.round(xOf(i)),up=b.c>=b.o,yh=Math.round(yOf(b.h)),yl=Math.round(yOf(b.l));
    g.fillStyle=up?th.wickUp:th.wickDown;g.fillRect(x,yh,1,Math.max(1,yl-yh));
    if(bw>1){const yo=yOf(b.o),yc=yOf(b.c),top=Math.round(Math.min(yo,yc)),hh=Math.max(1,Math.round(Math.abs(yc-yo))),bx=x-(bw-1)/2;
      g.fillStyle=up?th.up:th.down;g.fillRect(bx,top,bw,hh);if(th.border){g.strokeStyle=th.border;g.lineWidth=1;g.strokeRect(bx+.5,top+.5,bw-1,Math.max(0,hh-1));}}}
  if(S.theme.priceLine){const y=Math.round(yOf(M.bid))+.5;g.strokeStyle=th.priceLine;g.lineWidth=1;g.setLineDash(tv?[1,2]:[]);g.beginPath();g.moveTo(P.x,y);g.lineTo(P.x+P.w,y);g.stroke();g.setLineDash([]);}
  drawDrawings(g);
  CH.hits=[];const tags=[];drawPositions(g,tags);drawPreview(g,tags);
  g.restore();
  g.font=tv?FONT_MODERN:FONT_MT5;g.textBaseline='middle';g.fillStyle=tv?COL.axisText:'#e0e0e0';
  for(let p=Math.ceil(CH.pBot/pstep)*pstep;p<=CH.pTop;p+=pstep){const y=yOf(p);if(y<10||y>P.h-8)continue;g.fillText(p.toFixed(2),ax+8,y);}
  if(!tv){g.strokeStyle='#6a6a6a';g.lineWidth=1;g.beginPath();g.moveTo(ax+.5,0);g.lineTo(ax+.5,P.h);g.moveTo(0,P.h+.5);g.lineTo(ax,P.h+.5);g.stroke();}
  else{g.strokeStyle='#333';roundRect(g,ax+6,6,CH.axisW-12,20,3);g.stroke();g.fillStyle='#d1d4dc';g.fillText('USD  ▾',ax+13,16.5);}
  g.textAlign='center';
  for(const t of tlab){if(t.x<26||t.x>ax-26)continue;g.fillStyle=tv?(t.major?'#e0e3eb':COL.axisText):'#e0e0e0';g.font=tv&&t.major?'700 12px "Trebuchet MS",Arial':(tv?FONT_MODERN:FONT_MT5);g.fillText(t.text,t.x,P.h+CH.timeH/2);}
  g.textAlign='left';
  for(const t of CH.drawTags)axisTag(g,t.y,t.text,t.bg);
  for(const t of tags)axisTag(g,t.y,t.text,t.bg,'#fff');
  bidTag(g);crosshair(g);
  if(PANEL&&PANEL.afterDraw)PANEL.afterDraw();
  updateOtb();
}

/* ================= canvas input ================= */
const ptOf=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
function onDown(e){
  if(e.button!==0)return;const {x,y}=ptOf(e);CH.mouse={x,y};
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  if(S.c.menu)S.c.menu=false;
  for(const hb of CH.hits)if(x>=hb.x&&x<=hb.x+hb.w&&y>=hb.y&&y<=hb.y+hb.h){hb.fn();changed();return;}
  const D=S.draw,cap=()=>{try{cv.setPointerCapture(e.pointerId);}catch(_){}};
  if(D.tool&&inPlot(x,y)){startDraw(x,y);cap();changed();return;}
  const lv=hitLevel(x,y);if(lv){CH.drag={type:'level',k:lv};cap();return;}
  const sel=selItem();
  if(sel)for(const hd of handlesOf(sel))if(Math.hypot(hd.x-x,hd.y-y)<=7){CH.drag={type:'handle',it:sel,k:hd.k};cap();return;}
  if(inPlot(x,y))for(let k=D.items.length-1;k>=0;k--){const it=D.items[k];if(hitItem(it,x,y)){D.sel=it.id;CH.drag={type:'move',it,i0:iOf(x),p0:pOf(y),orig:JSON.parse(JSON.stringify(it))};cap();changed();return;}}
  D.sel=null;
  if(x>=CH.W-CH.axisW&&y<CH.plot.h){CH.drag={type:'scale',y0:y,top0:CH.pTop,bot0:CH.pBot};CH.auto=false;cap();changed();return;}
  if(inPlot(x,y)){CH.drag={type:'pan',x0:x,y0:y,rb0:CH.rightBar,top0:CH.pTop,bot0:CH.pBot,vert:!CH.auto};cap();cv.style.cursor='grabbing';}
  changed();
}
function onMove(e){
  const {x,y}=ptOf(e);CH.mouse={x,y};const d=CH.drag,D=S.draw;
  if(D.pending)D.pending.pts[D.pending.pts.length-1]=ptAt(x,y);
  if(d){
    if(d.type==='pan'){CH.rightBar=clampRB(d.rb0-(x-d.x0)/CH.barW);
      if(!d.vert&&Math.abs(y-d.y0)>6){d.vert=true;CH.auto=false;d.top0=CH.pTop;d.bot0=CH.pBot;}
      if(d.vert){const sh=(y-d.y0)/CH.plot.h*(d.top0-d.bot0);CH.pTop=d.top0+sh;CH.pBot=d.bot0+sh;}}
    else if(d.type==='scale'){const f=Math.exp((y-d.y0)*0.006),mid=(d.top0+d.bot0)/2,half=(d.top0-d.bot0)/2*f;CH.pTop=mid+half;CH.pBot=mid-half;}
    else if(d.type==='level')dragLevel(d.k,x,y);
    else if(d.type==='move'){const di=Math.round(iOf(x)-d.i0),dp=pOf(y)-d.p0,o=d.orig;d.it.pts=o.pts.map(q=>({i:q.i+di,p:+(q.p+dp).toFixed(2)}));if(o.tp!=null){d.it.tp=+(o.tp+dp).toFixed(2);d.it.sl=+(o.sl+dp).toFixed(2);}}
    else if(d.type==='handle')dragHandle(d.it,d.k,x,y);
    changed();return;
  }
  cv.style.cursor=cursorAt(x,y);changed();
}
function cursorAt(x,y){
  if(S.draw.tool)return 'crosshair';
  for(const hb of CH.hits)if(x>=hb.x&&x<=hb.x+hb.w&&y>=hb.y&&y<=hb.y+hb.h)return 'pointer';
  const lv=hitLevel(x,y);if(lv)return lv==='len'?'ew-resize':'ns-resize';
  const sel=selItem();if(sel&&handlesOf(sel).some(hd=>Math.hypot(hd.x-x,hd.y-y)<=7))return 'move';
  if(inPlot(x,y)&&S.draw.items.some(it=>hitItem(it,x,y)))return 'pointer';
  if(x>=CH.W-CH.axisW&&y<CH.plot.h)return 'ns-resize';
  return 'crosshair';
}
function onUp(e){
  const d=CH.drag;CH.drag=null;
  if(d&&d.type==='create'){const {x,y}=ptOf(e);if(S.draw.pending&&Math.hypot(x-d.x0,y-d.y0)>6)addPendingPoint(ptAt(x,y));}
  if(cv.style.cursor==='grabbing')cv.style.cursor='crosshair';
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(S.settingsOpen)renderSettings();changed();
}
function onWheel(e){
  e.preventDefault();const {x}=ptOf(e);
  if(x>=CH.W-CH.axisW){CH.auto=false;const f=e.deltaY>0?1.08:1/1.08,mid=(CH.pTop+CH.pBot)/2,half=(CH.pTop-CH.pBot)/2*f;CH.pTop=mid+half;CH.pBot=mid-half;changed();return;}
  const ia=iOf(x);CH.barW=clamp(CH.barW*(e.deltaY<0?1.12:1/1.12),1.5,60);CH.rightBar=clampRB(ia-0.5+(CH.plot.x+CH.plot.w-x)/CH.barW);changed();
}
function onDbl(e){const {x}=ptOf(e);if(S.draw.pending&&S.draw.pending.type==='path'){finishPath();changed();return;}if(x>=CH.W-CH.axisW){CH.auto=true;if(S.settingsOpen)renderSettings();changed();}}
function attachCanvas(){
  cv.addEventListener('pointerdown',onDown);cv.addEventListener('pointermove',onMove);
  cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);
  cv.addEventListener('pointerleave',()=>{if(!CH.drag){CH.mouse=null;changed();}});
  cv.addEventListener('wheel',onWheel,{passive:false});cv.addEventListener('dblclick',onDbl);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
}

function isOn(k){const [a,b]=k.split(':');switch(a){
  case 'side':return S.side===+b;case 'chip':return S.chip===+b;case 'type':return S.orderType===b;
  case 'preview':return !!S.side;case 'cmenu':return S.c.menu;case 'adock':return S.a.docked;}return false;}
function bind(roots,v){
  for(const root of roots){if(!root)continue;
    for(const e of root.querySelectorAll('[data-b]')){const t=v[e.dataset.b]??'';if(e.textContent!==t)e.textContent=t;}
    for(const e of root.querySelectorAll('[data-on]'))e.classList.toggle('on',isOn(e.dataset.on));
    for(const e of root.querySelectorAll('[data-show]'))e.hidden=!isOn(e.dataset.show);
    for(const e of root.querySelectorAll('[data-fld]'))e.classList.toggle('bad',!!S.errs[e.dataset.fld]);
    for(const e of root.querySelectorAll('input[data-f]')){const n=e.dataset.f;if(S.forceField!==n&&(document.activeElement===e||S.errs[n]))continue;const t=fieldText(n);if(e.value!==t)e.value=t;}
    for(const e of root.querySelectorAll('[data-status]')){if(e.textContent!==v.st.text)e.textContent=v.st.text;e.className=e.dataset.status+' l'+v.st.level;}
    for(const e of root.querySelectorAll('[data-confirm]')){e.disabled=!v.ok;e.classList.toggle('sell',v.c.side<0);}
  }
}
function dragMove(handleEl,el,pos,opts={}){
  handleEl.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('button,input'))return;e.preventDefault();try{handleEl.setPointerCapture(e.pointerId);}catch(_){}
    const r=el.getBoundingClientRect(),wr=wrap.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    const mv=ev=>{let nx=ev.clientX-wr.left-ox,ny=ev.clientY-wr.top-oy;const w=el.offsetWidth,hh=el.offsetHeight,mx=Math.max(0,CH.W-w),my=Math.max(0,CH.H-hh);
      nx=clamp(nx,0,mx);ny=clamp(ny,0,my);for(const sx of [0,mx,...(opts.snapX?opts.snapX():[])])if(Math.abs(nx-sx)<12)nx=sx;for(const sy of [0,my])if(Math.abs(ny-sy)<12)ny=sy;
      pos.x=nx;pos.y=ny;el.style.left=nx+'px';el.style.top=ny+'px';changed();};
    const up=()=>{handleEl.removeEventListener('pointermove',mv);handleEl.removeEventListener('pointerup',up);handleEl.removeEventListener('pointercancel',up);if(opts.onEnd)opts.onEnd();changed();};
    handleEl.addEventListener('pointermove',mv);handleEl.addEventListener('pointerup',up);handleEl.addEventListener('pointercancel',up);

    case 'type':setType(b);break;
    case 'unit':cycleUnit(b);break;
    case 'step':step(b,+c,e.shiftKey);break;
    case 'confirm':confirmOrder();break;
    case 'cancel':cancel();break;
    case 'a-collapse':S.a.collapsed=!S.a.collapsed;PANEL.place();break;
    case 'a-dock':S.a.docked=!S.a.docked;if(!S.a.docked)S.a.x-=60;PANEL.place();break;
    case 'b-side':S.b.side=S.b.side==='right'?'left':'right';placeAll();break;
    case 'b-collapse':S.b.collapsed=!S.b.collapsed;placeAll();break;
    case 'c-menu':S.c.menu=!S.c.menu;break;
    case 'algo':S.algo=!S.algo;S.flash=null;break;
    case 'auto':CH.auto=!CH.auto;break;
    case 'autoset':CH.auto=b==='1';break;
    case 'settings':S.settingsOpen=!S.settingsOpen;break;
    case 'theme':if(c==='toggle')S.theme[b]=!S.theme[b];else{S.theme[b]=c;if(b==='candles'&&c==='mt5'){S.theme.bg='#000000';S.theme.grid=true;}if(b==='candles'&&c==='modern'){S.theme.bg='#0f0f0f';S.theme.grid=false;}}break;
    case 'rc':S.rcOpen=!S.rcOpen;root.classList.toggle('rc-closed',!S.rcOpen);break;
    case 'tool':S.draw.tool=S.draw.tool===b?null:b;S.draw.pending=null;S.draw.sel=null;break;
    case 'magnet':S.draw.magnet=!S.draw.magnet;break;
    case 'dclear':S.draw.items=[];S.draw.sel=null;break;
    case 'dcol':{const it=selItem();if(it)it.color=b;break;}
    case 'dw':{const it=selItem();if(it)it.w=+b;break;}
    case 'ddash':{const it=selItem();if(it)it.dash=!it.dash;break;}
    case 'ddel':deleteSel();break;
  }
  renderSettings();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;run(b.dataset.cmd,e);changed();});
document.addEventListener('mousedown',e=>{if(e.target.closest('.st'))e.preventDefault();});
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.f;if(!n)return;applyField(n,e.target.value);S.editing=n;changed();});
document.addEventListener('focusin',e=>{const n=e.target.dataset&&e.target.dataset.f;if(!n)return;S.editing=n;if(n==='custom')S.chip=3;setTimeout(()=>e.target.select(),0);changed();});
document.addEventListener('focusout',e=>{const n=e.target.dataset&&e.target.dataset.f;if(!n)return;S.editing=null;changed();});
document.addEventListener('keydown',e=>{
  const t=e.target,n=t.dataset&&t.dataset.f;
  if(n){if(e.key==='Enter'||e.key==='Escape'){t.blur();e.preventDefault();}else if(e.key==='ArrowUp'||e.key==='ArrowDown'){step(n,e.key==='ArrowUp'?1:-1,e.shiftKey);e.preventDefault();changed();}return;}
  if(t.closest&&t.closest('input,textarea,[contenteditable]'))return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){cycleVariant(e.key==='ArrowRight'?1:-1);e.preventDefault();}
  else if(e.key==='Escape')escapeKey();
  else if((e.key==='Delete'||e.key==='Backspace')&&S.draw.sel){deleteSel();e.preventDefault();}
  else if(e.key==='Enter'&&S.draw.pending)finishPath();
  changed();
});
document.addEventListener('wheel',e=>{const t=e.target;if(!(t.dataset&&t.dataset.f)||document.activeElement!==t)return;e.preventDefault();step(t.dataset.f,e.deltaY<0?1:-1,e.shiftKey);changed();},{passive:false});

/* ================= prototype switcher, notes and state ================= */
const NOTES={
  A:{t:'A · Floating ticket',b:'An order ticket that floats over the chart. Drag its top bar anywhere: it snaps to the chart\'s edges and to its docked place at the right (within 12 px). Double-click the top bar, or press the window button, to dock or float it; the dash folds it to one row. It is always drawn over the SL and TP lines.',m:'This is the one that was built: the ActionInna order ticket in MetaTrader 5.'},
  B:{t:'B · Sidebar dock',b:'A panel as tall as the chart, docked to the right or the left edge (the arrows button). Confirm always sits at the bottom. The SL and TP lines end at the panel\'s edge. The chevron folds it to a narrow rail.',m:'Not built.'},
  C:{t:'C · On-chart position',b:'Trading on the chart itself. A small SELL | risk | BUY bar sits anywhere (drag its dots). Press BUY or SELL and a position box appears: drag its green or red edge for TP or SL, the grey line for a pending order, and the right handle for its width. The numbers on the box can be typed; risk and the first SL and TP are in the small menu.',m:'Not built.'},
};
function notesHTML(){
  const n=NOTES[variant];
  return `<h4>${n.t}</h4><p>${n.b}</p><p><b>In MetaTrader 5:</b> ${n.m}</p>
  <h4>Chart</h4><p>Drag the chart in any direction, use the mouse wheel to zoom, drag the price scale to stretch it, and double-click the price scale (or press A) for auto-scale again. The gear at the bottom right holds the chart settings. In MetaTrader 5, the ModernStyle script sets the same look.</p>
  <h4>Drawing tools</h4><p>Pick a tool, then click on the chart (Path: click several points, then double-click or press Enter). Click a drawing to select it: drag its points, change its colour or width, press Delete to remove it. A green dot under a tool means MetaTrader 5 has it built in; amber means it does not.</p>
  <table>${ORDER.map(k=>`<tr><td>${TOOLS[k].name}</td><td class="${TOOLS[k].mt5==='native'?'tag-n':'tag-c'}">${TOOLS[k].mt5==='native'?'Built in':'Not in MT5'}</td><td>${TOOLS[k].how}</td></tr>`).join('')}</table>
  <h4>Window: ${shell==='modern'?'the clean layout':'MetaTrader 5 as it opens'}</h4>
  <p>${shell==='modern'?'Made with MetaTrader 5\'s own settings, no code: the Market Watch moved to the right, the Navigator and the Toolbox hidden (Ctrl+N, Ctrl+T), one toolbar, and the drawing tools floating over the chart. See docs/layout.md.':'MetaTrader 5 as it opens: the Market Watch on the left, the Toolbox at the bottom, all the toolbars. The chart is the same; it just has less room.'}</p>`;
}
function buildProto(){
  const p=h('div','',`<div id="pnote" hidden></div><div id="pstate"></div><div class="pbar"><span class="ptag">PROTOTYPE</span><button id="pprev" title="Previous ticket (left arrow)">◀</button><span id="plabel"></span><button id="pnext" title="Next ticket (right arrow)">▶</button><span class="psep"></span><button id="pshell"></button><button id="pnotes">Notes</button><button id="pst">State</button></div>`);
  p.id='proto';document.body.append(p);
  if(qs.get('clean')==='1')p.hidden=true;
  $('#pprev').onclick=()=>cycleVariant(-1);$('#pnext').onclick=()=>cycleVariant(1);
  $('#pshell').onclick=()=>{shell=shell==='modern'?'mt5':'modern';S.theme.axis=shell;setParam('shell',shell);buildShell();};
  $('#pnotes').onclick=()=>{const n=$('#pnote');n.hidden=!n.hidden;renderProto();};
  $('#pst').onclick=()=>{const s=$('#pstate');s.hidden=!s.hidden;};
}
function renderProto(){
  const v=VARIANTS.find(v=>v.key===variant);$('#plabel').textContent=`${v.key} (${v.name})`;
  $('#pshell').textContent=shell==='modern'?'Window: clean layout':'Window: MT5 as it opens';
  const n=$('#pnote');if(!n.hidden)n.innerHTML=notesHTML();
}
function cycleVariant(d){const i=VARIANTS.findIndex(v=>v.key===variant);variant=VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].key;setParam('variant',variant);mountPanel();renderProto();}
function updateState(){
  const el=$('#pstate');if(!el||el.hidden)return;const c=calc(),D=S.draw,sel=selItem();
  const pan=variant==='A'?`ticket x=${S.a.x|0} y=${S.a.y|0} ${S.a.docked?'docked':'floating'}${S.a.collapsed?' folded':''}`
    :variant==='B'?`panel ${S.b.side}${S.b.collapsed?' folded':''} width=${sbW()}px`
    :`quick bar x=${S.c.x|0} y=${S.c.y|0} box=${S.side?'bar '+S.c.i0+' +'+S.c.len:'-'}`;
  const trade=S.side?`${c.kind} lots=${c.lots.toFixed(2)} SL=${tr(c.slP,1)} pips [${S.slUnit}] TP=${tr(c.tpP,1)} pips [${S.tpUnit}] risk=${riskShort(c.ri)}`:`idle risk=${riskShort(c.ri)}`;
  const ae=document.activeElement,ed=S.editing?`typing ${S.editing}="${ae&&ae.value!=null?ae.value:''}" (a new price never overwrites it)`:'not typing';
  const errs=Object.keys(S.errs).length?' · error='+Object.keys(S.errs).join(','):'';
  el.textContent=[ed+errs,`variant=${variant} window=${shell}`,pan,trade,`chart ${CH.auto?'auto':'free'} barW=${CH.barW.toFixed(1)}`,`drawings: tool=${D.tool||'-'} count=${D.items.length} selected=${sel?TOOLS[sel.type].name:'-'}${D.pending?' (drawing)':''}`,`algo=${S.algo?'on':'off'} positions=${S.positions.length}`].join('  |  ');
}

/* ================= ticks ================= */
setInterval(()=>{
  M.bid=+(M.bid+gauss()*0.22).toFixed(2);M.ask=+(M.bid+0.19).toFixed(2);
  let L=bars[bars.length-1];const now=Date.now();
  if(now>=L.t+TF){const atEnd=CH.rightBar!=null&&CH.rightBar>=bars.length-1;bars.push({t:L.t+TF,o:L.c,h:L.c,l:L.c,c:L.c});L=bars[bars.length-1];if(atEnd)CH.rightBar+=1;}
  L.c=M.bid;L.h=Math.max(L.h,M.bid);L.l=Math.min(L.l,M.bid);
  for(const w of WL){if(w.live){w.dir=Math.sign(M.bid-w.p)||w.dir;w.p=M.bid;}else if(rand()<0.25){const np=w.p*(1+gauss()*0.00015);w.dir=Math.sign(np-w.p);w.p=np;}w.chg=(w.p/w.open-1)*100;}
  changed();
},650);
setInterval(changed,1000);

seedDrawings();buildProto();buildShell();
</script>
