# MQL5 can only be compiled by MetaEditor inside a MetaTrader 5 install, so CI checks what it can
# without one, including the native tests: the same sources compiled with g++ against a fake MT5.
# Compiling in MetaEditor and the ActionInnaTests script stay part of every pull request
# (see CONTRIBUTING.md).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sources are ASCII only
        run: |
          if LC_ALL=C grep -rnP --include='*.mq5' --include='*.mqh' --include='*.ps1' --include='*.cs' --include='*.js' --include='*.html' --include='*.css' '[^\x00-\x7F]' mql5 scripts screen; then
            echo "::error::Non-ASCII characters found (MetaEditor, Windows PowerShell 5.1 and the C# compiler in Windows may misread them)."
            exit 1
          fi

      - name: No compiled programs or local files are tracked
        run: |
          if git ls-files | grep -E '\.ex5$|\.log$|^build/|^runtime/|mt5\.local\.json$'; then
            echo "::error::Compiled programs, logs or this PC's files are tracked."
            exit 1
          fi

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=scripts/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Native tests (worked examples, generated suites, broker profiles, ticket scenarios and fuzz)
        run: bash tests/native/run.sh

  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The screen's page parses
        run: for f in screen/web/js/*.js screen/tools/*.js; do node --check "$f"; done

      - name: The screen's tests (bars, scales, position tools, drawings, templates)
        run: node --test screen/test/*.test.js

  screen-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ModernScreen.exe builds with the C# compiler in Windows, and its tests pass
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-screen.ps1 -Tests
